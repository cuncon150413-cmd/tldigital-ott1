<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án TL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #38bdf8;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .btn-iptv {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-iptv:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        .btn-scratch {
            background-color: #f97316;
            color: #ffffff;
        }

        .btn-scratch:hover {
            background-color: #ea580c;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chào mừng các bạn đến với dự án TL</h1>
        
        <div class="btn-group">
            <a href="https://cuncon150413-cmd.github.io/tldigital-ott1/iptv/LAMDONG1/vtc720p.m3u8" class="btn btn-iptv" target="_blank" rel="noopener noreferrer">
                📺 Xem IPTV thử nghiệm
            </a>
            
            <a href="https://cuncon150413-cmd.github.io/tldigital-ott1/scratch/index.html" class="btn btn-scratch" target="_blank" rel="noopener noreferrer">
                🧩 Lập trình Scratch
            </a>
        </div>
    </div>

</body>
</html>
